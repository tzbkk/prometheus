[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
dynamic = ["version"]
description = "QQ guild channel archiver: entity store + contracted services (scraper/viewer/launcher) + archive packaging CLI"
requires-python = ">=3.10"
dependencies = ["prompt_toolkit>=3.0", "zstandard>=0.23"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving",
]

[project.optional-dependencies]
contracts = ["zhizong>=0.4.1"]
# 纯网扫码登录：二维码由 deepbackfill 服务直出 PNG、浏览器展示，无 QR 渲染依赖。

[project.scripts]
prometheus-launcher = "launcher.__main__:main"

[tool.setuptools]
py-modules = ["prometheus_version"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "prometheus_version.__version__"}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness subset only (classic ruff default) — legacy codebase, keep lint green, not aspirational.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap sys.path before project imports — deliberate.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
