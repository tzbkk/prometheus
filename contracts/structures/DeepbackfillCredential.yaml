SchemaVersion: 1
Type: structure
Name: DeepbackfillCredential
Description: >-
  conf/deepbackfill.conf.json（0600，gitignore，模板 example 入库）——deepbackfill
  凭据面记录：ptlogin2 网页扫码登录（external:qq-ptlogin，纯网路线）
  兑换的 p_skey + 四键。生产写入唯一入口 = deepbackfill 服务扫码成功面
  （AuthSessionManager：complete → 活测 → 0600 原子写）；auth 通道每页现取
  （缺/失效时服务自动起 QR 会话重登录）。展示面 p_skey 恒掩码（首 4 末 4
  ——凭证卫生）。
Location: urn:prometheus:type:DeepbackfillCredential
Definition:
  Form: record
  Table:
    - Field: uin
      Type: string
      Required: true
      Description: QQ 号（扫码登录产物，纯数字——cookie o 前缀剥除）。
    - Field: p_uin
      Type: string
      Required: true
      Description: "o<uin> 形（auth cookie 头组件，§2.1 规格）。"
    - Field: p_skey
      Type: string
      Required: true
      Description: pd.qq.com 域 44 字符 web 凭证（小时~天时效；bkn 由 auth 面按 §2.2 以 p_skey 自算——hash33(p_skey, 5381)）。
    - Field: minted_at
      Type: integer
      Required: true
      Description: 扫码登录时刻 epoch ms（重扫码即刷新）。
