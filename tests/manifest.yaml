# Prometheus 测试契约登记册（mandate register，）
#
# 人类署名工件：每行 asserts 为作者可审的一行中文；AIGC 不得绕过登记册私增测试。
# 硬规则：
#   1. 测试函数名 = "test_" + name 逐字对应（平铺函数，无测试类；node ID 机械匹配）
#   2. scripts/test_gate.py 强制 pytest 收集集 ↔ mandate 集严格双向对等——
#      孤儿测试（无 mandate）或空 mandate（无实现）→ CI 红
#   3. 新增测试 = 先加 mandate 行（作者审）→ 再写实现（TDD 变体）
#   4. implements 溯源必填：契约条款 / 文档条款优先
#   5. 禁 parametrize：一个函数展开 N 个 node ID，name ↔ node 双射被破坏
#
# ⚠️ 本文件不得移入 contracts/——zhizong loader 会把其中 *.yaml 当语料文档解析而炸。

version: 1
mandates:
  - id: MD-001
