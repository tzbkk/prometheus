SchemaVersion: 1
Type: structure
Name: TargetList
Description: >-
  launcher GET /targets 响应（富对象数组）。快照语义：一次返回全部三目标（监督拓扑）。
Location: urn:prometheus:type:TargetList
Definition:
  Form: record
  Table:
    - Field: targets
      Type: array<object>
      Required: true
      Description: 三目标状态对象数组。
      Fields:
        - Field: name
          Type: TargetName
          Required: true
          Description: 监督目标名（三枚举，TargetName 标量）。
        - Field: state
          Type: stopped|running|failed
          Required: true
          Description: 三态窄起步（真实可观测；starting/stopping 未来按 Evolution 追加）。
        - Field: pid
          Type: integer?
          Required: true
          Description: 进程 PID（unix）；stopped 态为 null。
        - Field: uptime_sec
          Type: integer?
          Required: true
          Description: 连续运行秒数；stopped 态为 null。
        - Field: restarts
          Type: integer
          Required: true
          Description: 累计重启次数（含崩溃自愈）。
